name: Transfer Cloudflare credential (sealed box)

# Workflow temporaneo: trasferisce il secret CLOUDFLARE_API_TOKEN verso un
# altro repository tramite libsodium sealed box. Il token in chiaro non viene
# mai stampato ne' esportato: esce solo il ciphertext, cifrato con la chiave
# pubblica del repository destinatario.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repository destinatario (owner/repo)"
        required: true
        default: "albertogiacomel/robot3d"
      secret_name:
        description: "Nome del secret da installare"
        required: true
        default: "CLOUDFLARE_API_TOKEN"
      public_key:
        description: "Chiave pubblica libsodium del repository destinatario (base64)"
        required: true
      key_id:
        description: "key_id della chiave pubblica del repository destinatario"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa PyNaCl
        run: python -m pip install --quiet pynacl

      - name: Sigilla il token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          SECRET_NAME: ${{ inputs.secret_name }}
          PUBLIC_KEY: ${{ inputs.public_key }}
          KEY_ID: ${{ inputs.key_id }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN non presente in questo repository"
            exit 1
          fi

          # Verifica che il token acceda all'account (nessun valore stampato)
          ACCOUNTS=$(curl -s -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts" | python -c \
            "import json,sys; d=json.load(sys.stdin); print(','.join(a['id'] for a in d.get('result',[])))")
          echo "account visibili: ${ACCOUNTS}"

          echo "key_id: ${KEY_ID}"

          PUBLIC_KEY="${PUBLIC_KEY}" KEY_ID="${KEY_ID}" CF_TOKEN="${CF_TOKEN}" \
            TARGET_REPO="${TARGET_REPO}" SECRET_NAME="${SECRET_NAME}" python - <<'PY' > sealed.json
          import base64, json, os
          from nacl.public import PublicKey, SealedBox
          token = os.environ["CF_TOKEN"].encode("utf-8")
          public_key = PublicKey(base64.b64decode(os.environ["PUBLIC_KEY"]))
          sealed = SealedBox(public_key).encrypt(token)
          json.dump(
              {
                  "encrypted_value": base64.b64encode(sealed).decode("ascii"),
                  "key_id": os.environ["KEY_ID"],
                  "target_repo": os.environ.get("TARGET_REPO", ""),
                  "secret_name": os.environ.get("SECRET_NAME", ""),
              },
              open("sealed.json", "w", encoding="utf-8"),
          )
          PY
          echo "ciphertext pronto: $(wc -c < sealed.json) byte"

      - name: Pubblica il ciphertext come artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealed-cloudflare-credential
          path: sealed.json
          retention-days: 1
          if-no-files-found: error
